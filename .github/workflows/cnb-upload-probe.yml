name: CNB Upload Probe

# 一次性探针：不上传构建产物，只用一个占位 APK 走完「查/建 release → 取上传 URL → PUT → 确认」
# 全流程，用来验证 CNB_TOKEN 作用域与 cnb Releases 附件 API 是否可用。验证完即删除。
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Create dummy APK
        run: printf 'dummy apk for cnb upload probe %s\n' "$(date -u)" > app-release.apk

      - name: Upload to CNB Release
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          CNB_REPO: Lingqi_Team/Tianxuan
          CNB_TAG: apk-latest
          APK_PATH: app-release.apk
        run: |
          set -euo pipefail
          API="https://api.cnb.cool"
          REPO="$CNB_REPO"
          TAG="$CNB_TAG"
          APK="$APK_PATH"
          ASSET="app-release.apk"
          SIZE=$(stat -c%s "$APK")

          auth() { curl -sS -H "Authorization: Bearer $CNB_TOKEN" -H "accept: application/json" "$@"; }

          # 1) 取 Release ID（tag 不存在则创建发行版）
          RESP=$(auth -X GET "$API/$REPO/-/releases/tags/$TAG")
          echo "GET tag resp: $RESP"
          RID=$(echo "$RESP" | python3 -c "import sys,json;print(json.load(sys.stdin).get('id',''))" 2>/dev/null || true)
          if [ -z "$RID" ]; then
            echo "Release for tag $TAG not found, creating..."
            CREATE=$(auth -X POST "$API/$REPO/-/releases" \
              -H "Content-Type: application/json" \
              -d "{\"tag_name\":\"$TAG\",\"name\":\"CI APK (latest)\",\"body\":\"Auto-published from GitHub Actions on main.\"}")
            echo "CREATE resp: $CREATE"
            RID=$(echo "$CREATE" | python3 -c "import sys,json;print(json.load(sys.stdin).get('id',''))" 2>/dev/null || true)
          fi
          if [ -z "$RID" ]; then
            echo "::error::Failed to resolve CNB release id. get=$RESP create=$CREATE"
            exit 1
          fi
          echo "Release id: $RID"

          # 2) 取上传/确认 URL
          UP=$(auth -X POST "$API/$REPO/-/releases/$RID/asset-upload-url" \
            -H "Content-Type: application/json" \
            -d "{\"asset_name\":\"$ASSET\",\"overwrite\":true,\"size\":$SIZE}")
          echo "UPLOAD-URL resp: $UP"
          UPLOAD_URL=$(echo "$UP" | python3 -c "import sys,json;print(json.load(sys.stdin).get('upload_url',''))" 2>/dev/null || true)
          VERIFY_URL=$(echo "$UP" | python3 -c "import sys,json;print(json.load(sys.stdin).get('verify_url',''))" 2>/dev/null || true)
          if [ -z "$UPLOAD_URL" ] || [ -z "$VERIFY_URL" ]; then
            echo "::error::Failed to get upload url. resp=$UP"
            exit 1
          fi

          # 3) 上传附件
          curl -sS -X PUT --data-binary @"$APK" "$UPLOAD_URL" \
            -H "Content-Type: application/vnd.android.package-archive"

          # 4) 确认上传
          auth -X POST "$VERIFY_URL" >/dev/null
          echo "::notice::APK published to CNB release $TAG ($ASSET, $SIZE bytes)"
          echo "Download: https://cnb.cool/$REPO/-/releases/download/$TAG/$ASSET"
